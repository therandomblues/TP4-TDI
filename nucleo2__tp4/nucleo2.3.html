    <img src="img/uno_convertir.png" data-reemplazo="img/slop/siete_convertir.png" alt="" />

       <img src="img/dos_convertir.png" data-reemplazo="img/slop/ocho_convertir.png" alt="" />

<li class="tarjeta2 tarjeta2_cuqui" id="panel-estado">
