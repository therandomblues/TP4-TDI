<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sección de Comentarios</title>
  <style>
    .comment-section { max-width: 500px; font-family: Arial, sans-serif; }
    #comment-input { width: 100%; height: 80px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    #submit-btn { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #submit-btn:hover { background-color: #0056b3; }
    .comment-box { background-color: #f8f9fa; padding: 12px; margin-top: 15px; border-left: 4px solid #007bff; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="comment-section">
    <h3>Deja un comentario</h3>
    <textarea id="comment-input" placeholder="Escribe aquí..."></textarea>
    <button id="submit-btn">Publicar</button>
    <div id="comments-list"></div>
  </div>

  <script>
    document.getElementById('submit-btn').addEventListener('click', function(event) {
      event.preventDefault(); // Evita recargas si está dentro de un formulario
      const input = document.getElementById('comment-input');
      const commentText = input.value.trim();

      if (commentText !== "") {
        const commentsList = document.getElementById('comments-list');
        const newComment = document.createElement('div');
        newComment.className = 'comment-box';
        newComment.innerText = commentText;
        
        commentsList.prepend(newComment);
        input.value = "";
      }
    });
  </script>
</body>
</html>
